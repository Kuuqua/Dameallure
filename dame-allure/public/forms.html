<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Dame Allure — form definitions</title></head>
<body>
  <!--
    This page is never linked to and never seen by visitors. Netlify's
    build bot can't execute JavaScript, so it can't discover forms that
    React renders client-side — this static file is the documented
    workaround: it lists every form + field name so Netlify registers
    them, then the real React forms (see src/lib/netlify-forms.js) submit
    to these same form names via fetch().
  -->

  <form name="create-your-curation" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="shoppingFor" />
    <input name="occasion" />
    <input name="budget" />
    <input name="needs" />
    <input name="style" />
    <input name="clothingSize" />
    <input name="shoeSize" />
    <input name="colourPreferences" />
    <input name="additionalNotes" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="whatsapp" />
  </form>

  <form name="gift-curation" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="who" />
    <input name="occasion" />
    <input name="budget" />
    <input name="style" />
    <input name="interests" />
    <input name="message" />
    <input name="name" />
    <input name="phone" />
  </form>

  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="message" />
  </form>

  <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="email" />
  </form>
</body>
</html>
